name: Build and test

on:
  push:
    branches: [master, 'feat/**', 'fix/**', 'refactor/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create project Python environment
        run: python -m venv .venv
      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        run: .venv/Scripts/python.exe -m pip install -r requirements-lock.txt
      - name: Install Python dependencies (Linux)
        if: runner.os != 'Windows'
        run: .venv/bin/python -m pip install -r requirements-lock.txt
      - run: npm --prefix frontend ci
      - run: npm run build
      - run: npm test
